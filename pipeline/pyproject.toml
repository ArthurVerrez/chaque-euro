[project]
name = "chaque-euro-pipeline"
version = "0.1.0"
description = "Ingest French public spending open data into Parquet and SQLite."
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6,<2",
    "truststore>=0.10.5",
]

[project.scripts]
chaque-euro = "chaque_euro.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "chaque_euro"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
