  "Quand un marché a plusieurs titulaires, nous répartissons son montant à parts égales entre eux pour calculer le total d'une organisation.",
  "Les montants signalés comme aberrants ou suspects par le consolidateur ne sont pas comptés dans les totaux. Pour les aberrants, son estimation par les marchés comparables (montant_rationalise) est affichée à titre indicatif à côté du montant déclaré. Les valeurs absentes, non positives ou d’au moins 999 999 999 € sont aussi exclues des totaux.",
  "Seuls les marchés de 40 000 € HT ou plus doivent être publiés, et certains acheteurs ne publient pas tout. Une absence ne prouve pas qu'un marché n'existe pas.",
  "Les acheteurs ont deux mois après la notification pour publier : les mois les plus récents sont incomplets.",
  "Nous ne retenons que les marchés notifiés depuis le 1er janvier 2019, dans leur dernière version connue (modifications incluses), datés par leur notification initiale si disponible, sinon la première notification connue.",
]

